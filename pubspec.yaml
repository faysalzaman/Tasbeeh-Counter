name: tesbeeh_counter
description: "A polished Digital Tasbeeh Counter & Dhikr App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.0

  # Storage
  shared_preferences: ^2.2.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Notifications
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.4

  # Audio
  audioplayers: ^6.0.0

  # Haptics
  vibration: ^3.2.0

  # In-app review
  in_app_review: ^2.0.9

  # In-app update
  in_app_update: ^4.2.3

  # Volume key handling
  volume_controller: ^3.1.0

  # UI
  cupertino_icons: ^1.0.8
  flutter_animate: ^4.5.0
  confetti: ^0.8.0
  percent_indicator: ^4.2.3
  google_fonts: ^6.2.1
  intl: ^0.20.2
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  equatable: ^2.0.5
  uuid: ^4.4.0
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.0

  # For detecting system theme
  dynamic_color: ^1.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  # Add assets for sounds
