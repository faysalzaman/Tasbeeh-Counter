<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgRadial" cx="35%" cy="25%" r="90%">
      <stop offset="0%" stop-color="#4CC488"/>
      <stop offset="55%" stop-color="#2E8B57"/>
      <stop offset="100%" stop-color="#164A2E"/>
    </radialGradient>

    <radialGradient id="beadGradient" cx="32%" cy="26%" r="78%">
      <stop offset="0%" stop-color="#FFF6DE"/>
      <stop offset="32%" stop-color="#F0C75E"/>
      <stop offset="68%" stop-color="#C59529"/>
      <stop offset="100%" stop-color="#7A5410"/>
    </radialGradient>

    <radialGradient id="imamBeadGradient" cx="34%" cy="24%" r="80%">
      <stop offset="0%" stop-color="#FFFAEE"/>
      <stop offset="30%" stop-color="#F3D27A"/>
      <stop offset="65%" stop-color="#D4A93A"/>
      <stop offset="100%" stop-color="#6B4E12"/>
    </radialGradient>

    <linearGradient id="starGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5DA9C"/>
      <stop offset="100%" stop-color="#C59529"/>
    </linearGradient>

    <radialGradient id="sheen" cx="30%" cy="18%" r="80%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <filter id="ringShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0A2E1B" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224" fill="url(#bgRadial)"/>

  <!-- Medallion framing rings -->
  <circle cx="512" cy="512" r="470" fill="none" stroke="#F5DA9C" stroke-width="4" opacity="0.16"/>
  <circle cx="512" cy="512" r="458" fill="none" stroke="#F5DA9C" stroke-width="1.5" opacity="0.22"/>

  <!-- Glass sheen -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224" fill="url(#sheen)"/>

  <!-- ============== TASBEEH RING (hero) ============== -->
  <g filter="url(#ringShadow)">

    <!-- Central 8-point Islamic star (rub el hizb), the medallion's heart -->
    <g transform="translate(512,478)">
      <path d="M 0,-118 L 30,-71 L 83,-83 L 71,-30 L 118,0 L 71,30 L 83,83 L 30,71 L 0,118 L -30,71 L -83,83 L -71,30 L -118,0 L -71,-30 L -83,-83 L -30,-71 Z"
            fill="url(#starGradient)" stroke="#8A6412" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="0" cy="0" r="26" fill="#164A2E" stroke="#F5DA9C" stroke-width="3"/>
      <circle cx="0" cy="0" r="12" fill="#F5DA9C"/>
    </g>

    <!-- Connecting string, peeking through bead gaps -->
    <circle cx="512" cy="480" r="300" fill="none" stroke="#4A340A" stroke-width="7" opacity="0.45"/>

    <!-- 24 beads forming the loop -->
    <g stroke="#6B4E12" stroke-width="2.5">
      <circle cx="812.0" cy="480.0" r="40" fill="url(#beadGradient)"/>
      <circle cx="802.8" cy="557.6" r="40" fill="url(#beadGradient)"/>
      <circle cx="771.8" cy="630.0" r="40" fill="url(#beadGradient)"/>
      <circle cx="724.1" cy="692.1" r="40" fill="url(#beadGradient)"/>
      <circle cx="662.0" cy="739.8" r="40" fill="url(#beadGradient)"/>
      <circle cx="589.6" cy="769.8" r="40" fill="url(#beadGradient)"/>
      <!-- k=6 is the Imam bead, drawn separately below -->
      <circle cx="434.4" cy="769.8" r="40" fill="url(#beadGradient)"/>
      <circle cx="362.0" cy="739.8" r="40" fill="url(#beadGradient)"/>
      <circle cx="299.9" cy="692.1" r="40" fill="url(#beadGradient)"/>
      <circle cx="252.2" cy="630.0" r="40" fill="url(#beadGradient)"/>
      <circle cx="222.2" cy="557.6" r="40" fill="url(#beadGradient)"/>
      <circle cx="212.0" cy="480.0" r="40" fill="url(#beadGradient)"/>
      <circle cx="222.2" cy="402.4" r="40" fill="url(#beadGradient)"/>
      <circle cx="252.2" cy="330.0" r="40" fill="url(#beadGradient)"/>
      <circle cx="299.9" cy="267.9" r="40" fill="url(#beadGradient)"/>
      <circle cx="362.0" cy="220.2" r="40" fill="url(#beadGradient)"/>
      <circle cx="434.4" cy="190.2" r="40" fill="url(#beadGradient)"/>
      <circle cx="512.0" cy="180.0" r="40" fill="url(#beadGradient)"/>
      <circle cx="589.6" cy="190.2" r="40" fill="url(#beadGradient)"/>
      <circle cx="662.0" cy="220.2" r="40" fill="url(#beadGradient)"/>
      <circle cx="724.1" cy="267.9" r="40" fill="url(#beadGradient)"/>
      <circle cx="771.8" cy="330.0" r="40" fill="url(#beadGradient)"/>
      <circle cx="802.8" cy="402.4" r="40" fill="url(#beadGradient)"/>
    </g>

    <!-- Specular highlights for a glossy, realistic bead finish -->
    <g fill="#FFFFFF" opacity="0.5">
      <ellipse cx="801" cy="468" rx="11" ry="8"/>
      <ellipse cx="792" cy="545" rx="11" ry="8"/>
      <ellipse cx="761" cy="617" rx="11" ry="8"/>
      <ellipse cx="714" cy="679" rx="11" ry="8"/>
      <ellipse cx="652" cy="727" rx="11" ry="8"/>
      <ellipse cx="580" cy="757" rx="11" ry="8"/>
      <ellipse cx="424" cy="757" rx="11" ry="8"/>
      <ellipse cx="352" cy="727" rx="11" ry="8"/>
      <ellipse cx="290" cy="679" rx="11" ry="8"/>
      <ellipse cx="242" cy="617" rx="11" ry="8"/>
      <ellipse cx="212" cy="545" rx="11" ry="8"/>
      <ellipse cx="202" cy="468" rx="11" ry="8"/>
      <ellipse cx="212" cy="390" rx="11" ry="8"/>
      <ellipse cx="242" cy="318" rx="11" ry="8"/>
      <ellipse cx="290" cy="256" rx="11" ry="8"/>
      <ellipse cx="352" cy="208" rx="11" ry="8"/>
      <ellipse cx="424" cy="178" rx="11" ry="8"/>
      <ellipse cx="502" cy="168" rx="11" ry="8"/>
      <ellipse cx="580" cy="178" rx="11" ry="8"/>
      <ellipse cx="652" cy="208" rx="11" ry="8"/>
      <ellipse cx="714" cy="256" rx="11" ry="8"/>
      <ellipse cx="761" cy="318" rx="11" ry="8"/>
      <ellipse cx="792" cy="390" rx="11" ry="8"/>
    </g>

    <!-- Imam bead (larger, teardrop) + tassel -->
    <g>
      <ellipse cx="512" cy="782" rx="48" ry="60" fill="url(#imamBeadGradient)" stroke="#6B4E12" stroke-width="3"/>
      <ellipse cx="500" cy="762" rx="14" ry="10" fill="#FFFFFF" opacity="0.5"/>

      <line x1="512" y1="842" x2="512" y2="878" stroke="#6B4E12" stroke-width="5" opacity="0.6"/>
      <circle cx="512" cy="892" r="20" fill="url(#beadGradient)" stroke="#6B4E12" stroke-width="2.5"/>
      <line x1="512" y1="912" x2="512" y2="936" stroke="#6B4E12" stroke-width="4" opacity="0.6"/>
      <circle cx="512" cy="950" r="17" fill="url(#beadGradient)" stroke="#6B4E12" stroke-width="2.5"/>

      <g stroke="#C59529" stroke-width="4" opacity="0.8" stroke-linecap="round">
        <path d="M 500,966 C 494,988 486,1004 478,1018" fill="none"/>
        <path d="M 507,968 C 504,992 501,1008 498,1024" fill="none"/>
        <path d="M 512,969 C 512,994 512,1010 512,1026" fill="none"/>
        <path d="M 517,968 C 520,992 523,1008 526,1024" fill="none"/>
        <path d="M 524,966 C 530,988 538,1004 546,1018" fill="none"/>
      </g>
    </g>
  </g>
</svg>
