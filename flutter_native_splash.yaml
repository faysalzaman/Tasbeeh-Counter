flutter_native_splash:
  # ---- Light mode ----
  color: "#276174"
  image: assets/icon/splash_screen.png

  # ---- Dark mode ----
  color_dark: "#276174"
  image_dark: assets/icon/splash_screen.png

  android_12:
    # Android 12+ splash uses a smaller centered icon on a solid color by spec
    color: "#276174"
    image: assets/icon/playstore-icon.png
    color_dark: "#276174"
    image_dark: assets/icon/playstore-icon.png

  android: true
  ios: true
  web: false

  # Keep the splash on screen briefly after first frame so the counter/home
  # screen doesn't flash in before its own theme finishes applying.
  fullscreen: true
